<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goo Ball Sains</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f1e4;
  --grid: #ded8c8;
  --ink: #2452d7;
  --fill: rgba(60,110,240,.12);
  --text: #263b70;
  --muted: #697797;
  --panel: #fffdf6;
  --line: rgba(36,82,215,.16);
  --shadow: 0 8px 28px rgba(28,43,86,.12);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #171b28;
  --grid: #292f42;
  --ink: #8caaff;
  --fill: rgba(125,162,255,.14);
  --text: #e1e8ff;
  --muted: #a5b0cf;
  --panel: #202638;
  --line: rgba(140,170,255,.22);
  --shadow: 0 8px 28px rgba(0,0,0,.25);
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #171b28;
    --grid: #292f42;
    --ink: #8caaff;
    --fill: rgba(125,162,255,.14);
    --text: #e1e8ff;
    --muted: #a5b0cf;
    --panel: #202638;
    --line: rgba(140,170,255,.22);
    --shadow: 0 8px 28px rgba(0,0,0,.25);
  }
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--paper);
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea { font: inherit; }

button {
  min-height: 44px;
  padding: 9px 13px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  font-weight: 650;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .12s, opacity .12s, background .12s;
}

button:active:not(:disabled) { transform: scale(.96); }
button:disabled { opacity: .4; cursor: default; }

#bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 15px 8px;
}

.game-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--paper);
  font-size: 23px;
}

.brand-name {
  font-size: 13px;
  font-weight: 850;
  letter-spacing: 1px;
}

.brand-name span { color: var(--ink); }

#t {
  margin-top: 2px;
  font-size: 16px;
  font-weight: 750;
}

.game-status {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 11px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #29ae78;
}

#mission {
  flex-shrink: 0;
  margin: 0 12px 8px;
  padding: 10px 13px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.mission-label {
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

#hint {
  font-size: 12px;
  line-height: 1.5;
}

#play-area {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#c {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#ready-indicator {
  min-height: 16px;
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  pointer-events: none;
}

#controls {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
  padding: 9px 12px 12px;
  background: var(--paper);
  border-top: 1px solid var(--line);
}

.tool-btn {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 2px;
  min-width: 0;
  min-height: 53px;
  padding: 5px 2px;
  background: transparent;
  border-color: transparent;
  font-size: 10px;
}

.tool-icon {
  font-size: 21px;
  line-height: 1.2;
}

#controls .add-ball,
#controls #sh { display: none; }

#controls .primary-btn {
  grid-column: 1 / -1;
  min-height: 48px;
  color: #fff;
  background: #2452d7;
  border-color: #2452d7;
  border-radius: 15px;
  font-size: 13px;
  letter-spacing: .6px;
}

#controls .primary-btn:disabled {
  color: var(--muted);
  background: var(--grid);
  border-color: transparent;
  opacity: 1;
}

#m { min-width: 0; }
#m svg { width: 21px; height: 21px; }

#tune, #lb, #sp {
  display: none;
  position: fixed;
  z-index: 10;
  left: 10px;
  right: 10px;
  top: auto;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-height: 72dvh;
  overflow-y: auto;
  padding: 18px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  font-size: 13px;
}

#tune label { line-height: 1.6; }
#tune input[type="range"] { accent-color: var(--ink); }
#sp textarea {
  margin-bottom: 10px;
  padding: 10px;
  color: var(--text);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
}

#ov {
  display: none;
  position: fixed;
  z-index: 20;
  left: 0;
  right: 0;
  bottom: 0;
  align-items: flex-end;
  justify-content: center;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}

#card {
  position: relative;
  pointer-events: auto;
  width: min(100%, 420px);
  padding: 12px 16px 14px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  text-align: center;
}

#ot { font-size: 18px; font-weight: 850; padding: 0 34px; }
#os { margin: 4px 0; font-size: 22px; }
#od { margin-bottom: 10px; font-size: 12px; line-height: 1.5; }
#ob { width: 100%; color: white; background: var(--ink); }
#oc { position: absolute; top: 6px; right: 6px; min-height: 32px; padding: 2px 11px; border-radius: 10px; }
#op { display: none; pointer-events: auto; min-height: 38px; padding: 6px 16px; border-radius: 19px; box-shadow: var(--shadow); }
#ov.min #card { display: none; }
#ov.min #op { display: block; }

@media(max-height: 650px) {
  #bar { padding-top: 5px; }
  #mission { padding: 6px 10px; margin-bottom: 3px; }
  #controls { gap: 3px; padding: 4px 8px 6px; }
  .tool-btn { min-height: 42px; }
  #controls .primary-btn { min-height: 42px; }
}

@media(min-width: 700px) {
  body { max-width: 760px; margin: 0 auto; }
  #controls { padding-left: 20px; padding-right: 20px; }
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<header id="bar">
  <div class="game-brand">
    <span class="brand-mark">●</span>
    <div>
      <div class="brand-name">GOO BALL <span>SAINS</span></div>
      <div id="t">1. Menara</div>
    </div>
  </div>
  <div class="game-status">
    <span class="status-dot"></span>
    <span id="s">Sisa: 8</span>
  </div>
</header>

<section id="mission">
  <div class="mission-label">MISI SAAT INI</div>
  <div id="hint"></div>
  <div id="ready-indicator">Susun bola untuk mulai</div>
</section>

<div id="tune"></div>
<div id="lb"></div>
<div id="sp">
  <textarea id="code" rows="4"
    style="width:100%;box-sizing:border-box"></textarea>
  <button id="cp">Salin kode</button>
  <button id="ld">Muat rancangan</button>
</div>

<main id="play-area">
  <canvas id="c"></canvas>
</main>

<nav id="controls" aria-label="Kontrol permainan">
  <button id="r" class="tool-btn">
    <span class="tool-icon">↻</span>
    <span>Ulangi</span>
  </button>
  <button id="g" class="tool-btn">
    <span class="tool-icon">⚙</span>
    <span>Setel</span>
  </button>
  <button id="m" class="tool-btn" aria-label="Suara"></button>
  <button id="sk" class="tool-btn">
    <span class="tool-icon">★</span>
    <span>Skor</span>
  </button>
  <button id="en" class="tool-btn">
    <span class="tool-icon" id="eni">∞</span>
    <span id="ent">Endless</span>
  </button>
  <button id="sh" class="tool-btn">
    <span class="tool-icon">⇧</span>
    <span>Kode</span>
  </button>
  <button id="ab" class="tool-btn add-ball">
    <span class="tool-icon">＋</span>
    <span>Tambah bola</span>
  </button>
  <button id="u" class="primary-btn" disabled>
    UJI STRUKTUR
  </button>
</nav>

<div id="ov">
  <div id="card">
    <button id="oc" aria-label="Sembunyikan hasil">▾</button>
    <div id="ot"></div>
    <div id="os"></div>
    <div id="od"></div>
    <input id="tm" placeholder="Nama kelompok"
      maxlength="16"
      style="display:none;margin-bottom:10px;padding:8px;
      border:2px solid var(--ink);border-radius:8px;
      background:var(--paper);color:var(--text);width:80%">
    <button id="ob"></button>
    <button id="ob2" style="display:none;width:100%;margin-top:6px">Ulang dari awal</button>
  </div>
  <button id="op">Hasil ▴</button>
</div>

<script>
const {Engine,Bodies,Body,Composite,Constraint,Events}=Matter;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const engine=Engine.create();engine.gravity.y=.85;engine.constraintIterations=2;
const world=engine.world,R=15;
const P={stiff:.15,damp:.015,bounce:.55,grav:.85,wind:.0012,squash:.026,snap:1.5};
let W,H,G,dpr,lw=0,lh=0,walls=[],balls=[],links=[],cliffs=[],drag=null,weight=null;
let li=0,state='build',stable=0,ready=false,testT=0,anchors={},lastCand=0;
const LV=[
 {n:'1. Menara',h:'Bangun menara sampai garis putus-putus.',balls:12,par:4,goal:200,sci:'Segitiga itu kokoh: sisinya saling menahan, jadi bentuknya sulit berubah.'},
 {n:'2. Jembatan',h:'Sambungkan dua tebing, lalu tekan Uji untuk menjatuhkan beban.',balls:10,par:3,cliff:true,test:'weight',sci:'Beban menekan jembatan, lalu sambungan menyalurkannya ke kedua tebing.'},
 {n:'3. Uji Angin',h:'Bangun menara, lalu tekan Uji. Angin bertiup dari kiri.',balls:12,par:4,goal:150,test:'wind',sci:'Angin mendorong menara. Susunan yang kokoh membagi gaya ke semua sambungannya.'},
 {n:'4. Gempa',h:'Bangun menara, lalu tekan Uji. Tanah akan bergoyang ke kiri dan kanan.',balls:13,par:5,goal:170,test:'quake',sci:'Gempa menggoyang dasar bangunan. Rangka segitiga yang saling silang menahan goyangan dari dua arah.'},
 {n:'5. Jembatan Panjang',h:'Tebing lebih jauh dan bebannya lebih berat. Sambungkan lalu tekan Uji.',balls:14,par:5,cliff:true,gap:230,wd:.0225,test:'weight',sci:'Makin panjang jembatan, makin besar gaya tarik pada sambungannya. Itu sebabnya jembatan panjang butuh rangka yang rapat.'},
 {n:'6. Pipa',h:'Bangun jalan sampai pipa di atas tebing. Bola yang tidak terpakai akan terhisap masuk. Makin banyak yang selamat, makin banyak bintang.',balls:14,par:0,pipe:true,sci:'Hemat bahan itu penting: struktur yang efisien memakai bahan lebih sedikit tapi tetap sampai tujuan.'},
 {n:'7. Pelampung',h:'Bola hijau tosca putus-putus itu ringan dan mengangkat susunan. Bangun menara setinggi target.',balls:13,par:5,goal:260,kinds:{ringan:3},sci:'Benda yang lebih ringan dari udara bisa mengangkat beban. Begitulah prinsip balon udara.'},
 {n:'8. Berduri',h:'Ada paku di jurang. Bola yang jatuh ke paku akan pecah. Sambungkan tebing, lalu uji.',balls:13,par:5,cliff:true,gap:200,spikes:true,test:'weight',sci:'Bahaya membuat kita merencanakan lebih teliti sebelum membangun.'},
 {n:'9. Pulang',h:'Bola-bola ingin pulang ke pipa, tapi jalannya berduri. Bangun jembatan, sisanya akan pulang. Bola oranye itu berat.',balls:14,par:0,pipe:true,spikes:true,kinds:{berat:2},sci:'Rekayasa yang baik menyelamatkan orang lain dengan memakai bahan seperlunya.'},
 {n:'10. Penyedot',h:'Bangun menara tinggi sampai ujung penyedot. Bola yang tidak terpakai akan tersedot lewat selang dan masuk ke wadah.',balls:18,par:0,vac:true,vh:.72,sci:'Penyedot menurunkan tekanan udara di dalamnya. Udara luar yang tekanannya lebih tinggi mendorong benda ringan masuk ke penyedot.'},
 {n:'11. Penyedot Tinggi',h:'Penyedotnya lebih tinggi dan agak jauh ke kanan. Menaranya perlu condong dan kokoh.',balls:20,par:0,vac:true,vh:.82,vx:.5,sci:'Menara yang tinggi butuh dasar yang lebar dan rangka segitiga agar tidak mudah goyah.'},
 {n:'12. Penyedot Ringan',h:'Bola hijau putus-putus itu ringan dan mengangkat susunan. Manfaatkan untuk naik ke penyedot.',balls:19,par:0,vac:true,vh:.8,vx:.46,kinds:{ringan:4},sci:'Benda yang lebih ringan dari udara terangkat ke atas, seperti balon udara.'},
 {n:'13. Penyedot Berat',h:'Ada bola oranye yang berat. Letakkan di bawah supaya menara tidak mudah miring.',balls:20,par:0,vac:true,vh:.78,vx:.44,kinds:{berat:3},sci:'Beban berat di dasar menurunkan titik berat sehingga bangunan lebih stabil.'},
 {n:'14. Bebas',h:'Bangun apa saja dengan +Bola, lalu Uji. Tekan Kode untuk membagikan atau memuat rancangan temanmu.',balls:10,par:99,free:true,test:'wind',sci:'Menguji rancangan orang lain itu cara belajar yang sangat baik.'},
 {n:'∞ Endless',endless:true,vac:true,balls:14,par:0,vh:.54,vx:.46,sci:''}
];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
/* ---------- suara ---------- */
let ac=null,muted=false,noise=null,wg=null,lastThud=0;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f0,f1,d,type='sine',v=.2,delay=0){if(muted||!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function blup(f,d,v,delay=0){if(muted||!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
 o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.7,t+d*.3);o.frequency.exponentialRampToValueAtTime(f*.6,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function wet(d,v,fc=900){if(muted||!ac)return;const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
const sPick=()=>{blup(300+Math.random()*120,.16,.22);blup(520,.12,.1,.05)};
const sCreak=m=>{if(muted||!ac)return;tone(700+Math.random()*500,420,.12,'triangle',Math.min(.07,.02*m))};
const sStick=()=>{blup(240,.3,.3);blup(150,.35,.2,.04);wet(.18,.25,700)};
const sHop=()=>blup(200+Math.random()*100,.14,.1);
const sTick=()=>blup(520,.07,.07);
const sWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.28,'triangle',.2,i*.12));
const sLose=()=>{tone(420,80,.8,'sawtooth',.14);tone(300,60,.9,'triangle',.12,.1)};
function wind(on){if(!ac||muted&&on)return;
 if(!noise){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  noise=ac.createBufferSource();noise.buffer=b;noise.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=600;f.Q.value=.7;
  wg=ac.createGain();wg.gain.value=0;noise.connect(f);f.connect(wg);wg.connect(ac.destination);noise.start()}
 wg.gain.linearRampToValueAtTime(on?.18:0,ac.currentTime+.4)}
Events.on(engine,'collisionStart',e=>{const n=performance.now();if(n-lastThud<70)return;
 for(const p of e.pairs){const s=Math.max(p.bodyA.speed,p.bodyB.speed);if(s>4){lastThud=n;blup(140+Math.random()*50,.16,Math.min(.25,s*.02));if(s>6)burst((p.bodyA.position.x+p.bodyB.position.x)/2,(p.bodyA.position.y+p.bodyB.position.y)/2,4,inkC(),1.5);wet(.08,Math.min(.15,s*.012),500);break}}});
/* ---------- dunia ---------- */
function buildWalls(){walls.forEach(w=>Composite.remove(world,w));
 walls=[Bodies.rectangle(W/2,G+30,W*3,60,{isStatic:true,friction:1}),Bodies.rectangle(-30,H/2,60,H*4,{isStatic:true}),Bodies.rectangle(W+30,H/2,60,H*4,{isStatic:true})];
 Composite.add(world,walls)}
function mkBall(x,y,st,free){const b=Bodies.circle(x,y,R,{isStatic:st,friction:.8,frictionAir:.012,restitution:P.bounce,density:.005});
 b.goo={free,t:Math.random()*6,trait:!st&&Math.random()<.3,kind:''};Composite.add(world,b);balls.push(b);return b}
function link(a,b,fl){const len=fl||Math.max(50,Math.min(95,dist(a.position,b.position)));
 const c=Constraint.create({bodyA:a,bodyB:b,length:len,stiffness:P.stiff,damping:P.damp});Composite.add(world,c);links.push(c)}
function load(i){li=i;const L=LV[i];Composite.clear(world,false);links=[];balls=[];cliffs=[];drag=null;weight=null;
 state='build';stable=0;ready=false;testT=0;got=0;snap0=null;firstBreak=null;slow=0;brkN=0;engine.timing.timeScale=1;$('ob2').style.display='none';pipe=null;vac=null;drops=[];inBox=0;fx=[];stuck=0;spikes=[];wind(false);$('ov').style.display='none';$('ov').classList.remove('min');buildWalls();
 const ch=90,cw=(W-(L.gap||150))/2;
 if(L.cliff){
  for(const x of[cw/2,W-cw/2]){const r=Bodies.rectangle(x,G-ch/2,cw,ch,{isStatic:true,friction:1});r.cw=cw;r.ch=ch;cliffs.push(r)}
  Composite.add(world,cliffs);if(L.spikes)spikes=[{x0:cw,x1:W-cw}];
  const a1=mkBall(cw-12,G-ch-R,true),a2=mkBall(cw-62,G-ch-R,true),b1=mkBall(W-cw+12,G-ch-R,true),b2=mkBall(W-cw+62,G-ch-R,true);
  link(a1,a2);link(b1,b2);anchors={a:a1,b:b1};
  for(let k=0;k<L.balls;k++){const left=k%2===0;mkBall(left?20+Math.random()*(cw-90):W-cw+70+Math.random()*(cw-90),G-ch-R-4,false,true)}
 }else if(L.vac){
  const bw=80,bh=80,cx=W*.35;
  vac={x:Math.min(W*(L.vx||.42),W-120),y:Math.max(85,G-(L.hpx||G*(L.vh||.74))),bx:W-bw/2-14,bw:bw,bh:bh};
  const a=mkBall(cx-45,G-R,true,false),b=mkBall(cx+45,G-R,true,false),c=mkBall(cx,G-75,false,false);link(a,b);link(a,c);link(b,c);anchors={a:a,b:b};
  for(let k=0;k<L.balls;k++)mkBall(20+Math.random()*(W*.55),G-R-2-Math.random()*70,false,true)
 }else if(L.pipe){

function applyKinds(L){if(!L.kinds)return;const fr=balls.filter(b=>b.goo.free);for(const k in L.kinds)for(let i=0;i<L.kinds[k]&&fr.length;i++){const b=fr.pop();b.goo.kind=k;Body.setDensity(b,k==='berat'?.0225:.002)}}
function lbGet(){try{return JSON.parse(localStorage.getItem('goo_lb')||'{}')}catch(e){return{}}}
function lbSave(team,lv,st){try{const d=lbGet();d[team]=d[team]||{};d[team][lv]=Math.max(d[team][lv]||0,st);localStorage.setItem('goo_lb',JSON.stringify(d));localStorage.setItem('goo_team',team)}catch(e){}}
function lbShow(){const rows=Object.entries(lbGet()).map(([t,v])=>[t,Object.values(v).reduce((a,b)=>a+b,0),Object.keys(v).length]).sort((a,b)=>b[1]-a[1]);
 $('lb').innerHTML='<b>Papan Skor</b> (di perangkat ini)'+(rows.length?rows.map((r,i)=>'<div>'+(i+1)+'. '+esc(r[0])+': '+r[1]+' bintang, '+r[2]+' level</div>').join(''):'<div>Belum ada skor.</div>')+'<button id="lc">Hapus skor</button>';
 $('lc').onclick=()=>{try{localStorage.removeItem('goo_lb')}catch(e){}lbShow()}}
function exportCode(){const att=balls.filter(b=>!b.goo.free),idx=new Map(att.map((b,i)=>[b,i]));
 return btoa(JSON.stringify({n:att.map(b=>[Math.round(b.position.x),Math.round(b.position.y),b.isStatic?1:0,b.goo.kind||'']),l:links.filter(l=>idx.has(l.bodyA)&&idx.has(l.bodyB)).map(l=>[idx.get(l.bodyA),idx.get(l.bodyB),Math.round(l.length)])}))}
function importCode(s){let d;try{d=JSON.parse(atob(s.trim()))}catch(e){return}
 load(LV.findIndex(l=>l.free));balls.filter(b=>!b.goo.free).forEach(b=>Composite.remove(world,b));balls=balls.filter(b=>b.goo.free);links.forEach(l=>Composite.remove(world,l));links=[];
 const m=d.n.map(a=>{const b=mkBall(a[0],a[1],!!a[2],false);if(a[3]){b.goo.kind=a[3];Body.setDensity(b,a[3]==='berat'?.0225:.002)}return b});
 d.l.forEach(a=>link(m[a[0]],m[a[1]],a[2]))}
function pn(id){for(const k of['tune','lb','sp'])$(k).style.display=(k===id&&$(k).style.display!=='block')?'block':'none'}
$('g').onclick=()=>pn('tune');
$('sk').onclick=()=>{lbShow();pn('lb')};
$('sh').onclick=()=>{$('code').value=exportCode();pn('sp')};
$('cp').onclick=()=>{$('code').select();try{navigator.clipboard.writeText($('code').value)}catch(e){}};
$('ld').onclick=()=>{importCode($('code').value);pn('sp')};
$('ab').onclick=()=>{if(state==='build'&&LV[li].free)mkBall(30+Math.random()*(W-60),G-R-2,false,true)};
document.addEventListener('pointerdown',e=>{if(e.target.closest('#tune,#lb,#sp,#g,#sk,#sh'))return;for(const k of['tune','lb','sp'])$(k).style.display='none'},true);
addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
