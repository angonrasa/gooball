<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goo Ball Sains</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f1e4;
  --grid: #ded8c8;
  --ink: #2452d7;
  --fill: rgba(60,110,240,.12);
  --text: #263b70;
  --muted: #697797;
  --panel: #fffdf6;
  --line: rgba(36,82,215,.16);
  --shadow: 0 8px 28px rgba(28,43,86,.12);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #171b28;
  --grid: #292f42;
  --ink: #8caaff;
  --fill: rgba(125,162,255,.14);
  --text: #e1e8ff;
  --muted: #a5b0cf;
  --panel: #202638;
  --line: rgba(140,170,255,.22);
  --shadow: 0 8px 28px rgba(0,0,0,.25);
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #171b28;
    --grid: #292f42;
    --ink: #8caaff;
    --fill: rgba(125,162,255,.14);
    --text: #e1e8ff;
    --muted: #a5b0cf;
    --panel: #202638;
    --line: rgba(140,170,255,.22);
    --shadow: 0 8px 28px rgba(0,0,0,.25);
  }
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--paper);
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea { font: inherit; }

button {
  min-height: 44px;
  padding: 9px 13px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  font-weight: 650;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .12s, opacity .12s, background .12s;
}

button:active:not(:disabled) { transform: scale(.96); }
button:disabled { opacity: .4; cursor: default; }

#bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 15px 8px;
}

.game-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--paper);
  font-size: 23px;
}

.brand-name {
  font-size: 13px;
  font-weight: 850;
  letter-spacing: 1px;
}

.brand-name span { color: var(--ink); }

#t {
  margin-top: 2px;
  font-size: 16px;
  font-weight: 750;
}

.game-status {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 11px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #29ae78;
}

#mission {
  flex-shrink: 0;
  margin: 0 12px 8px;
  padding: 10px 13px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.mission-label {
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

#hint {
  font-size: 12px;
  line-height: 1.5;
}

#play-area {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#c {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#ready-indicator {
  min-height: 16px;
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  pointer-events: none;
}

#controls {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
  padding: 9px 12px 12px;
  background: var(--paper);
  border-top: 1px solid var(--line);
}

.tool-btn {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 2px;
  min-width: 0;
  min-height: 53px;
  padding: 5px 2px;
  background: transparent;
  border-color: transparent;
  font-size: 10px;
}

.tool-icon {
  font-size: 21px;
  line-height: 1.2;
}

#controls .add-ball,
#controls #sh { display: none; }

#controls .primary-btn {
  grid-column: 1 / -1;
  min-height: 48px;
  color: #fff;
  background: #2452d7;
  border-color: #2452d7;
  border-radius: 15px;
  font-size: 13px;
  letter-spacing: .6px;
}

#controls .primary-btn:disabled {
  color: var(--muted);
  background: var(--grid);
  border-color: transparent;
  opacity: 1;
}

#m { min-width: 0; }
#m svg { width: 21px; height: 21px; }

#tune, #lb, #sp, #kd {
  display: none;
  position: fixed;
  z-index: 10;
  left: 10px;
  right: 10px;
  top: auto;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-height: 72dvh;
  overflow-y: auto;
  padding: 18px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  font-size: 13px;
}

#tune label { line-height: 1.6; }
#tune input[type="range"] { accent-color: var(--ink); }
#sp textarea {
  margin-bottom: 10px;
  padding: 10px;
  color: var(--text);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
}

#ov {
  display: none;
  position: fixed;
  z-index: 20;
  left: 0;
  right: 0;
  bottom: 0;
  align-items: flex-end;
  justify-content: center;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}

#card {
  position: relative;
  pointer-events: auto;
  width: min(100%, 420px);
  padding: 12px 16px 14px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  text-align: center;
}

#ot { font-size: 18px; font-weight: 850; padding: 0 34px; }
#os { margin: 4px 0; font-size: 22px; }
#od { margin-bottom: 10px; font-size: 12px; line-height: 1.5; }
#ob { width: 100%; color: white; background: var(--ink); }
#oc { position: absolute; top: 6px; right: 6px; min-height: 32px; padding: 2px 11px; border-radius: 10px; }
#op { display: none; pointer-events: auto; min-height: 38px; padding: 6px 16px; border-radius: 19px; box-shadow: var(--shadow); }
#ov.min #card { display: none; }
#ov.min #op { display: block; }

@media(max-height: 650px) {
  #bar { padding-top: 5px; }
  #mission { padding: 6px 10px; margin-bottom: 3px; }
  #controls { gap: 3px; padding: 4px 8px 6px; }
  .tool-btn { min-height: 42px; }
  #controls .primary-btn { min-height: 42px; }
}

@media(min-width: 700px) {
  body { max-width: 760px; margin: 0 auto; }
  #controls { padding-left: 20px; padding-right: 20px; }
}

/* ---- tampilan fokus: hanya goo & struktur ---- */
body { position: relative; }
#bar { gap: 8px; padding: 6px 10px 2px; }
#hb {
  flex-shrink: 0;
  min-width: 40px;
  min-height: 40px;
  padding: 0;
  border-radius: 50%;
  font-size: 17px;
}
#hb[aria-expanded="true"] { color: var(--paper); background: var(--ink); }
@keyframes hbp {
  0%, 100% { box-shadow: 0 0 0 0 var(--line); }
  50% { box-shadow: 0 0 0 7px transparent; }
}
#hb.pulse { animation: hbp 1.8s ease-in-out infinite; }
#res {
  display: none;
  flex: 1;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
#res.on { display: flex; }
#mb {
  flex: 1;
  max-width: 230px;
  min-height: 40px;
  padding: 6px 14px;
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
  border-radius: 20px;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#mi { min-width: 40px; min-height: 40px; padding: 0; border-radius: 50%; }
.game-status { margin-left: auto; padding: 6px 10px; opacity: .85; }
#mission {
  display: none;
  position: absolute;
  z-index: 8;
  left: 12px;
  right: 12px;
  top: calc(env(safe-area-inset-top, 0px) + 54px);
  margin: 0;
  box-shadow: var(--shadow);
}
#mission.show { display: block; }
#t { margin: 0 0 4px; font-size: 15px; font-weight: 750; }
#ready-indicator { display: none; }
#controls {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 4px;
}
.tool-btn { white-space: nowrap; }
.tool-btn.on { background: var(--fill); border-color: var(--line); }
#u {
  flex: 1;
  max-width: 230px;
  margin: 0 auto;
  min-height: 40px;
  padding: 6px 14px;
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
  border-radius: 20px;
  font-size: 13px;
  letter-spacing: .4px;
  white-space: nowrap;
}
#u:disabled { color: var(--muted); background: var(--grid); border-color: transparent; opacity: 1; }
#res.on ~ #u { display: none; }
#sp b { display: block; margin: 12px 0 5px; }
#sp b:first-child { margin-top: 0; }
#shp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
#shp button { min-height: 42px; padding: 6px 4px; font-size: 12px; }
#sp textarea { display: block; width: 100%; box-sizing: border-box; }
#svgl { display: block; margin: 0 0 8px; font-size: 12px; color: var(--muted); }
#svgm { margin-top: 6px; color: #c0392b; font-size: 12px; }
#tune, #lb, #sp, #kd {
  top: calc(env(safe-area-inset-top, 0px) + 56px);
  bottom: auto;
  max-height: calc(100dvh - 140px);
}
#ov {
  top: calc(env(safe-area-inset-top, 0px) + 56px);
  bottom: auto;
  align-items: flex-start;
  padding: 0 10px;
}
</style>
<script src="lib/matter.min.js"></script>
</head>
<body>

<header id="bar">
  <button id="hb" class="pulse" aria-label="Lihat misi" aria-expanded="false">?</button>

<div id="tune"></div>
<div id="lb"></div>
<div id="sp">
  <b>Bentuk dasar</b>

<main id="play-area">

<nav id="controls" aria-label="Kontrol permainan">

    <span class="tool-icon">◇</span>
    <span>Bentuk</span>

  <button id="ab" class="tool-btn add-ball">
    <span class="tool-icon">＋</span>

  <button id="kdb" class="tool-btn add-ball">
    <span class="tool-icon" id="kdi">●</span>
    <span id="kdt">Jenis</span>

</nav>

<div id="ov">
  <div id="card">
    <button id="oc" aria-label="Sembunyikan hasil">▴</button>
    <div id="ot"></div>
    <div id="os"></div>
    <div id="od"></div>
    <input id="tm" placeholder="Nama kelompok"
      maxlength="16"
      style="display:none;margin-bottom:10px;padding:8px;
      border:2px solid var(--ink);border-radius:8px;

    <button id="ob"></button>
    <button id="ob2" style="display:none;width:100%;margin-top:6px">Ulang dari awal</button>
  </div>
</div>

/* ---------- bola goo berjalan di struktur & lantai ---------- */
let fr=0;const WALK_SP=1.15,WALK_OFF=2*R-2,MASK_ALL=4294967295;
const standOn=(b,o)=>b.goo&&b.goo.free&&!b.isStatic&&o!==walls[1]&&o!==walls[2]&&o.position.y-b.position.y>8;
for(const ev of['collisionStart','collisionActive'])Events.on(engine,ev,e=>{for(const p of e.pairs){if(standOn(p.bodyA,p.bodyB))p.bodyA.goo.gt=fr;if(standOn(p.bodyB,p.bodyA))p.bodyB.goo.gt=fr}});
function stopWalk(b){const g=b.goo;if(!g||!g.wk)return;g.wk=null;b.collisionFilter.mask=MASK_ALL;Body.setVelocity(b,{x:(Math.random()-.5)*2,y:-1})}
function segPt(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;let u=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;u=Math.max(0,Math.min(1,u));return{u:u,x:a.x+dx*u,y:a.y+dy*u}}
const walkK=g=>g.kind==='berat'?.7:g.kind==='ringan'?1.25:1;
function walkStep(){if(state!=='build')return;
 for(const b of balls){const g=b.goo;if(!g.free||b===drag||b.isStatic)continue;
  if(g.wk)walkEdge(b,g);else{wander(b,g);tryAttach(b,g)}}}
function tryAttach(b,g){if(b.speed>2.4||Math.random()>.05)return;const p=b.position;let best=null,bd=WALK_OFF+4;
 for(const l of links){const A=l.bodyA.position,B=l.bodyB.position;if(dist(A,B)<30)continue;const q=segPt(p,A,B),d=dist(p,q);if(d<bd&&p.y<=q.y+6){bd=d;best={l:l,q:q}}}
 if(!best)return;
 let nx=p.x-best.q.x,ny=p.y-best.q.y;const nl=Math.hypot(nx,ny);if(nl<1){nx=0;ny=-1}else{nx/=nl;ny/=nl}
 g.wk={e:best.l,u:best.q.u,dir:Math.random()<.5?1:-1,sp:WALK_SP*walkK(g),pause:0,nx:nx,ny:ny};b.collisionFilter.mask=0}
function walkEdge(b,g){const w=g.wk;let l=w.e;
 if(!links.includes(l)||!balls.includes(l.bodyA)||!balls.includes(l.bodyB)){stopWalk(b);return}
 if(w.pause>0)w.pause--;
 else{const len=Math.max(24,dist(l.bodyA.position,l.bodyB.position));w.u+=w.dir*w.sp/len;
  if(Math.random()<.004)w.dir=-w.dir;else if(Math.random()<.003)w.pause=30+(Math.random()*70|0);
  if(w.u>=1||w.u<=0){const atB=w.u>=1,node=atB?l.bodyB:l.bodyA;w.u=atB?1:0;
   const opts=links.filter(k=>k!==l&&(k.bodyA===node||k.bodyB===node));
   if(opts.length&&Math.random()<.7){const k=opts[Math.random()*opts.length|0];w.e=l=k;w.dir=k.bodyA===node?1:-1;w.u=k.bodyA===node?0:1}else w.dir=-w.dir}}
 const A=l.bodyA.position,B=l.bodyB.position,dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
 let nx=dy/L,ny=-dx/L;if(ny>0){nx=-nx;ny=-ny}
 if(Math.abs(ny)<.45&&nx*w.nx+ny*w.ny<0){nx=-nx;ny=-ny}
 w.nx=nx;w.ny=ny;
 const tx=A.x+dx*w.u+nx*WALK_OFF,ty=A.y+dy*w.u+ny*WALK_OFF,p=b.position;
 Body.setPosition(b,{x:p.x+(tx-p.x)*.35,y:p.y+(ty-p.y)*.35});Body.setVelocity(b,{x:0,y:0})}
function wander(b,g){if(fr-g.gt>3)return;
 if(--g.wt<=0){const r=Math.random();g.wd=r<.3?0:r<.65?-1:1;g.wt=40+(Math.random()*140|0)}
 if(!g.wd||b.speed>3)return;
 const x=b.position.x,y=b.position.y,nx=x+g.wd*(R+7);let ok=nx>R&&nx<W-R;
 if(ok)ok=Matter.Query.point([walls[0]].concat(cliffs,crates,balls.filter(o=>!o.goo.free)),{x:nx,y:y+R+8}).length>0;
 if(ok&&spikes.length&&y>G-R-10)for(const s of spikes)if(nx>s.x0-10&&nx<s.x1+10)ok=false;
 if(!ok){g.wd=-g.wd;g.wt=40+(Math.random()*100|0);return}
 Body.setVelocity(b,{x:g.wd*.95*walkK(g),y:b.velocity.y});
 if(Math.abs(x-g.px)<.25)g.sc++;else g.sc=0;g.px=x;
 if(g.sc>25){g.sc=0;if(Math.random()<.5)Body.setVelocity(b,{x:g.wd*1.6,y:-5});else g.wd=-g.wd}}

/* ---------- bentuk dasar & impor SVG (level Bebas) ---------- */
const S0=56,cxFor=w=>Math.min(Math.max(W*.42,w/2+R+6),W-w/2-R-6);
const nearE=(P,lim)=>{const E=[];for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)if(Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1])<lim)E.push([i,j]);return E};
function shGrid(c,r){const P=[],cx=cxFor((c-1)*S0);for(let y=0;y<r;y++)for(let x=0;x<c;x++)P.push([cx+(x-(c-1)/2)*S0,G-R-y*S0]);return[P,nearE(P,S0*1.5)]}
function shTri(n){const P=[],cx=cxFor((n-1)*S0);for(let y=0;y<n;y++){const k=n-y;for(let x=0;x<k;x++)P.push([cx+(x-(k-1)/2)*S0,G-R-y*S0*.866])}return[P,nearE(P,S0*1.15)]}
function shCircle(){const r=70,cx=cxFor(2*r),cy=G-R-r,P=[],E=[];for(let k=0;k<8;k++){const a=k*Math.PI/4;P.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}P.push([cx,cy]);for(let k=0;k<8;k++)E.push([k,(k+1)%8],[k,(k+2)%8],[k,8]);return[P,E]}
const SHAPES=[['■','Kotak',()=>shGrid(3,3)],['▬','Persegi panjang',()=>shGrid(5,2)],['▲','Segitiga',()=>shTri(4)],['●','Lingkaran',shCircle],['▮','Menara',()=>shGrid(2,5)]];
$('shp').innerHTML=SHAPES.map((q,i)=>'<button data-i="'+i+'">'+q[0]+' '+q[1]+'</button>').join('');
$('shp').onclick=e=>{const b=e.target.closest('button[data-i]');if(!b||!LV[li].free)return;const r=SHAPES[+b.dataset.i][2]();buildStruct(r[0],r[1])};
function buildStruct(P,E){if(!LV[li].free)return;
 balls.filter(b=>!b.goo.free).forEach(b=>rmBall(b));
 const m=P.map(q=>mkBall(q[0],q[1],false,false)),seen=new Set();
 for(const e of E){const k=e[0]<e[1]?e[0]+'-'+e[1]:e[1]+'-'+e[0];if(e[0]===e[1]||seen.has(k))continue;seen.add(k);
  link(m[e[0]],m[e[1]],Math.max(20,Math.round(Math.hypot(P[e[0]][0]-P[e[1]][0],P[e[0]][1]-P[e[1]][1]))))}
 sStick();$('sp').style.display='none'}
function svgPolys(src){
 const doc=new DOMParser().parseFromString(src,'image/svg+xml'),root=doc.documentElement;
 if(doc.querySelector('parsererror')||!root||root.localName!=='svg')return null;
 const NS='http://www.w3.org/2000/svg',tmp=document.createElementNS(NS,'svg'),vb=root.getAttribute('viewBox');
 tmp.setAttribute('style','position:absolute;left:-9999px;top:0;width:400px;height:400px;visibility:hidden;pointer-events:none');
 if(vb&&/^[\d.\s,eE+-]+$/.test(vb))tmp.setAttribute('viewBox',vb);
 const GEO={path:['d'],polygon:['points'],polyline:['points'],line:['x1','y1','x2','y2'],rect:['x','y','width','height','rx','ry'],circle:['cx','cy','r'],ellipse:['cx','cy','rx','ry']};
 const clone=(a,dst)=>{for(const ch of a.children){const n=ch.localName;
  if(n==='g'||n==='svg'){const g=document.createElementNS(NS,'g');if(ch.getAttribute('transform'))g.setAttribute('transform',ch.getAttribute('transform'));dst.appendChild(g);clone(ch,g)}
  else if(GEO[n]){const el=document.createElementNS(NS,n);for(const at of GEO[n])if(ch.hasAttribute(at))el.setAttribute(at,ch.getAttribute(at));if(ch.getAttribute('transform'))el.setAttribute('transform',ch.getAttribute('transform'));dst.appendChild(el)}}};
 clone(root,tmp);document.body.appendChild(tmp);
 const raw=[];
 try{for(const el of tmp.querySelectorAll('path,polygon,polyline,line,rect,circle,ellipse')){
  let len=0;try{len=el.getTotalLength()}catch(e){}if(!(len>0))continue;
  const m=el.getCTM()||{a:1,b:0,c:0,d:1,e:0,f:0},N=Math.min(400,Math.max(24,Math.round(len/2))),pts=[];
  for(let i=0;i<=N;i++){const q=el.getPointAtLength(len*i/N);pts.push([m.a*q.x+m.c*q.y+m.e,m.b*q.x+m.d*q.y+m.f])}
  let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const th=Math.max(tot/N*6,1e-6),tag=el.localName,d=(el.getAttribute('d')||'').trim();
  let closed=tag==='rect'||tag==='circle'||tag==='ellipse'||tag==='polygon'||(tag==='path'&&/[zZ]$/.test(d)),cur=[pts[0]];
  const parts=[];
  for(let i=1;i<pts.length;i++){if(Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])>th){parts.push(cur);cur=[pts[i]];closed=false}else cur.push(pts[i])}
  parts.push(cur);for(const q of parts)if(q.length>1)raw.push({p:q,closed:closed&&parts.length===1})}}
 finally{tmp.remove()}
 if(!raw.length)return null;
 let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
 for(const pl of raw)for(const q of pl.p){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}
 const bw=x1-x0,bh=y1-y0;if(bw<1e-6&&bh<1e-6)return null;
 const mw=Math.min(W*.78,340),mh=Math.max(60,Math.min(G-130,340)),sc=Math.min(bw>1e-6?mw/bw:1e9,bh>1e-6?mh/bh:1e9);
 return raw.map(pl=>({closed:pl.closed,p:pl.p.map(q=>[(q[0]-x0)*sc,(q[1]-y0)*sc])}))}
function svgGraph(polys,brace){let SP=48;
 for(let t=0;t<14;t++,SP*=1.18){
  const nodes=[],E=new Set(),hubs=[];
  const add=(x,y)=>{for(let i=0;i<nodes.length;i++)if(Math.hypot(nodes[i][0]-x,nodes[i][1]-y)<SP*.6)return i;nodes.push([x,y]);return nodes.length-1};
  const ed=(a,b)=>{if(a!==b)E.add(a<b?a+'-'+b:b+'-'+a)};
  for(const pl of polys){const pts=pl.closed?pl.p.concat([pl.p[0]]):pl.p;let acc=0,prev=pts[0];const ids=[add(pts[0][0],pts[0][1])];
   for(let i=1;i<pts.length;i++){const b=pts[i];acc+=Math.hypot(b[0]-prev[0],b[1]-prev[1]);prev=b;if(acc>=SP){ids.push(add(b[0],b[1]));acc=0}}
   if(acc>SP*.5)ids.push(add(prev[0],prev[1]));
   for(let i=1;i<ids.length;i++)ed(ids[i-1],ids[i]);
   for(let i=2;i<ids.length;i++)ed(ids[i-2],ids[i]);
   if(pl.closed&&ids.length>2){ed(ids[ids.length-1],ids[0]);ed(ids[ids.length-2],ids[0]);ed(ids[ids.length-1],ids[1])}
   if(brace&&pl.closed&&ids.length>=5)hubs.push([...new Set(ids)])}
  for(const ids of hubs){let cx=0,cy=0;ids.forEach(i=>{cx+=nodes[i][0];cy+=nodes[i][1]});nodes.push([cx/ids.length,cy/ids.length]);const h=nodes.length-1,st=ids.length>10?2:1;for(let i=0;i<ids.length;i+=st)ed(h,ids[i])}
  if(nodes.length<2||nodes.length>60)continue;
  let a0=1e18,a1=-1e18,b1=-1e18;nodes.forEach(q=>{a0=Math.min(a0,q[0]);a1=Math.max(a1,q[0]);b1=Math.max(b1,q[1])});
  const dx=cxFor(a1-a0)-(a0+a1)/2,dy=(G-R)-b1;
  return[nodes.map(q=>[q[0]+dx,q[1]+dy]),[...E].map(k=>k.split('-').map(Number))]}
 return null}
$('svgb').onclick=()=>{const src=$('svgin').value.trim(),m=$('svgm');m.textContent='';
 if(!LV[li].free)return;
 if(!src){m.textContent='Tempel kode SVG dulu.';return}

 let polys=null;try{polys=svgPolys(src)}catch(e){}
 if(!polys){m.textContent='SVG tidak terbaca atau tidak punya garis/bentuk.';return}
 const r=svgGraph(polys,$('svgk').checked);
 if(!r){m.textContent='Bentuk terlalu rumit. Sederhanakan SVG-nya.';return}
 buildStruct(r[0],r[1])};

let conf=[],celeb=-1,flash=0;
function addConf(x,y){conf.push({x:x,y:y,vx:(Math.random()-.5)*1.6,vy:.8+Math.random()*1.8,rot:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:3+Math.random()*4,c:'hsl('+Math.random()*360+',85%,'+(55+Math.random()*10)+'%)',ph:Math.random()*6,l:0,m:260})}
function firework(){const x=W*(.12+Math.random()*.76),y=H*(.1+Math.random()*.38),h=Math.random()*360;
 burst(x,y,28,'hsl('+h+',90%,58%)',5.4);burst(x,y,16,'hsl('+(h+40)+',95%,68%)',3.2);burst(x,y,8,'hsl(48,100%,62%)',6.8);

function celebStep(){
 for(const q of conf){q.x+=q.vx+Math.sin(q.l*.08+q.ph)*.6;q.y+=q.vy;q.vy=Math.min(q.vy+.04,3.2);q.rot+=q.vr;q.l++}
